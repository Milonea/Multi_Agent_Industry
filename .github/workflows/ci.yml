name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 설정
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 계약 및 회귀 테스트
        run: python -m unittest discover -s tests -v
      - name: 문서·정책·Schema 검사
        run: python scripts/validate_repo.py
      - name: Agent Registry 검사
        run: python -m agent_runtime validate

  # Extra platform job: runs the same commands on a case- and Unicode-normalization-
  # insensitive filesystem so the path identity tests are not skipped. The required
  # integrated check remains the "validate" job above.
  validate-macos:
    name: validate-macos
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 설정
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 계약 및 회귀 테스트
        run: python -m unittest discover -s tests -v
      - name: 문서·정책·Schema 검사
        run: python scripts/validate_repo.py
      - name: Agent Registry 검사
        run: python -m agent_runtime validate
